name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Embed and Structure JRE 17 into Assets
        run: |
          # បង្កើត Directory structure ឱ្យត្រូវតាម PojavLauncher
          JRE_DIR="app_pojavlauncher/src/main/assets/components/jre-new/jre17-pojav"
          mkdir -p "$JRE_DIR"
          
          # Copy Java 17 ចូល
          cp -r $JAVA_HOME/* "$JRE_DIR/"
          
          # បង្កើត Manifest File ដើម្បីឱ្យ App ស្គាល់ Component នេះស្វ័យប្រវត្តិ
          echo "jre17-pojav" > app_pojavlauncher/src/main/assets/components/jre-new/component_manifest.txt

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app_pojavlauncher:assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PojavLauncher-APK
          path: app_pojavlauncher/build/outputs/apk/debug/*.apk
