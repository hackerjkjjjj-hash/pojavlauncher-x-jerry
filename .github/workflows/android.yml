name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download and Extract JRE 17 into Assets
        run: |
          # បង្កើត folder សម្រាប់ទុក JRE 17
          mkdir -p app_pojavlauncher/src/main/assets/components/jre-new
          cd app_pojavlauncher/src/main/assets/components/jre-new
          
          # Download file JRE 17
          wget https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/jre17-pojav/jre17-pojav.tar.xz
          
          # ពន្លាត File .tar.xz ឱ្យចេញជា Folder Java
          tar -xf jre17-pojav.tar.xz
          
          # លុប File បង្អាប់ចោល ដើម្បីកាត់បន្ថយទំហំ APK
          rm jre17-pojav.tar.xz

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app_pojavlauncher:assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PojavLauncher-APK
          path: app_pojavlauncher/build/outputs/apk/debug/*.apk
          
